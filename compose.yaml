name: emer

# Three always-on containers:
#   frontend (nginx)        — the only one published to the host; serves UI assets,
#                             proxies the app shell + /api/* to the backend
#   backend  (PHP + Apache) — routes, controllers, auth/session, talks to the db
#   db       (MariaDB)      — reachable from the backend only
# phpMyAdmin is an on-demand tool (profile "tools"), not part of the app:
#   docker compose --profile tools up -d phpmyadmin

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      # Bound to 127.0.0.1 only for this local-test phase (not exposed to the
      # network/internet). Widen to "0.0.0.0:${APP_PORT}:80" only in a later,
      # explicitly-approved step when actually sharing a link with testers.
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    # Hardening: ตัด Linux capabilities ทิ้งทั้งหมด เหลือเท่าที่ nginx ต้องใช้ (bind :80 แล้วลดสิทธิ์เป็น user nginx)
    # ระบบไฟล์อ่านอย่างเดียว — เขียนได้เฉพาะ tmpfs (cache/pid)
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 128m
    pids_limit: 100

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # No "ports:" — reachable only through the frontend on the "edge" network.
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edge
      - data
    volumes:
      # Persist what the app may write at runtime without baking it into the image.
      - storage_data:/var/www/html/storage
    healthcheck:
      # CLI script outside public/ — checks Apache answers and the DB login works
      # (see docker/healthcheck.php for why /api/health is not used here).
      test: ["CMD", "php", "/var/www/html/docker/healthcheck.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # Hardening: Apache ต้อง bind :80 แล้วลดสิทธิ์ worker เป็น www-data เท่านั้น
    # อ่านอย่างเดียวทั้ง image — ที่เขียนได้คือ volume storage/ (session) + tmpfs ของ Apache/PHP
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    mem_limit: 512m
    pids_limit: 200

  db:
    # 10.11 LTS (รองรับถึง ก.พ. 2028) — เดิม 10.4 หมดอายุการสนับสนุนแล้ว (EOL มิ.ย. 2024)
    # pin ถึง patch version; อัปเกรด major ครั้งต่อไปให้ทำแบบเดิม: backup → ทดสอบบน volume แยก → สลับ volume
    image: mariadb:10.11.19
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - data
    volumes:
      - db_data:/var/lib/mysql
      # Runs once, only when the data volume is empty (fresh DB) — alphabetical
      # order matters here, which is exactly why schema.sql + seed.sql are used
      # instead of the raw migrations/ folder (see report: 001-add-restock.sql
      # sorts before 001-initial.sql alphabetically and would fail on a fresh DB).
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # schema.sql already contains migrations 001-009; 010+ are applied on top
      - ./database/migrations/010-lots-shifts-colors.sql:/docker-entrypoint-initdb.d/03-migration-010.sql:ro
      - ./database/migrations/011-lot-details-equipment-types.sql:/docker-entrypoint-initdb.d/04-migration-011.sql:ro
      - ./database/migrations/012-three-item-types.sql:/docker-entrypoint-initdb.d/05-migration-012.sql:ro
      - ./database/migrations/013-force-password-change.sql:/docker-entrypoint-initdb.d/06-migration-013.sql:ro
      - ./database/migrations/014-audit-log.sql:/docker-entrypoint-initdb.d/07-migration-014.sql:ro
      - ./database/migrations/015-app-user-least-privilege.sql:/docker-entrypoint-initdb.d/08-migration-015.sql:ro
      - ./database/migrations/016-vehicle-type.sql:/docker-entrypoint-initdb.d/09-migration-016.sql:ro
    # ปิด LOAD DATA LOCAL INFILE (แอปไม่ได้ใช้)
    command: ["--local-infile=0"]
    healthcheck:
      # healthcheck.sh ของ image เอง: ใช้บัญชี healthcheck@localhost (สิทธิ์ USAGE) ที่ image สร้างไว้ตอน init
      # รหัสอยู่ใน /var/lib/mysql/.my-healthcheck.cnf (mode 600) — เดิมใส่ root password ใน argv
      # ทำให้เห็นได้จาก process list
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No "ports:" here on purpose — the database is reachable only from other
    # containers on the internal "data" network (service name "db"), never from the host.
    restart: unless-stopped
    # entrypoint ของ MariaDB ต้อง chown datadir แล้วลดสิทธิ์เป็น user mysql (gosu)
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 200

  phpmyadmin:
    # ใช้เมื่อจำเป็นเท่านั้น แล้วหยุดทันทีหลังใช้: docker compose stop phpmyadmin
    image: phpmyadmin:5.2.3
    profiles: ["tools"]
    environment:
      PMA_HOST: db
      PMA_ABSOLUTE_URI: http://localhost:${PHPMYADMIN_PORT:-8081}/
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      # "data" is internal (no host port publishing), so the published port needs
      # a normal network too — a separate one, so phpMyAdmin never sees the app.
      - admin
    restart: "no"

networks:
  # frontend <-> backend
  edge:
  # backend/phpMyAdmin <-> db — internal: no route to or from outside Docker
  data:
    internal: true
  admin:

volumes:
  # MariaDB 10.11 ใช้ volume ใหม่ (ย้ายข้อมูลด้วย dump/restore 2026-10-28)
  # volume เดิมของ 10.4 = emer_db_data — เก็บไว้สำหรับย้อนกลับ ห้ามลบจนกว่าจะมั่นใจ
  #   ย้อนกลับ: image: mariadb:10.4.34 + ลบบรรทัด name ด้านล่าง แล้ว docker compose up -d
  # ⚠️ name ตายตัว = ไม่ผูกกับชื่อ project: `docker compose -p <ชื่ออื่น>` จะใช้ volume จริงตัวนี้ด้วย
  #    (MariaDB 2 ตัวบน datadir เดียวกัน = ข้อมูลเสียได้) — stack ทดสอบต้อง override name ของ volume เสมอ
  db_data:
    name: emer_db_data_1011
  storage_data:
