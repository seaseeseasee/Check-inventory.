# emer — frontend (edge) container
#
# The only container published to the host. It serves the UI's static files
# (CSS/JS/images from resources/assets, baked into this image) itself, and
# reverse-proxies everything else — the app shell "/" and the JSON API "/api/*"
# — to the backend. Both stay on ONE origin, which the app requires:
#   - the app shell is rendered by PHP and embeds the session-bound CSRF token
#     (resources/views/layouts/app.php), so it cannot be a static file here
#   - the session cookie is SameSite=Strict and AuthService checks APP_ORIGIN

# Docker's embedded DNS — re-resolve "backend" so a recreated backend container
# (new IP) does not leave nginx proxying to a stale address (502).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Matches PHP's default post_max_size (8M) on the backend
    client_max_body_size 8m;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Container healthcheck only — never touches the backend
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static UI assets — same URLs the PHP asset() helper generates
    # (/assets/<path>?v=<mtime>). Anything not baked in here falls back to the
    # backend, which still knows how to serve it (public/index.php).
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri @backend;

        # Same headers public/.htaccess sets on Apache responses, so assets
        # behave exactly as before (including the "no-store" it forces).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # App shell + /api/* — always the backend (jump straight to the shared
    # proxy block so its settings live in one place)
    location / {
        try_files /nonexistent @backend;
    }

    location @backend {
        set $backend_upstream http://backend:80;
        proxy_pass $backend_upstream;

        # Keep the browser's Host (e.g. localhost:8080) so URLs/cookies the
        # backend builds are unchanged from the single-container setup.
        proxy_set_header Host $http_host;
        # Overwrite (not append) — the client cannot spoof its own IP, which
        # AuthService uses for login-attempt tracking.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
